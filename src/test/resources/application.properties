# Test ortamı yapılandırması (Testcontainers PostgreSQL ile gerçek veritabanı)
jwt.secret=test-secret-key-for-unit-and-integration-tests-12345678
jwt.issuer=banking-platform-test
jwt.access.token.expiration-seconds=900
jwt.refresh.token.expiration-seconds=3600

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.port=0
