# ---------------------------------------------------------------------------
# Geliştirme Profili (dev) - Swagger/OpenAPI erişimi
# ---------------------------------------------------------------------------
# Bu profil yalnızca geliştirme ortamında etkindir. Production'da kullanılmaz.
# Swagger/OpenAPI endpoint'leri geliştirme sırasında kimlik doğrulamasız erişilebilir olur.
# Production'da bu profil kullanılmayacağından güvenlik riski oluşturmaz.

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Swagger endpoint'lerini geliştirme profilinde herkese açık yapmak için
# SecurityConfig'de dev profile sahip ayrı bir filter chain gerekecektir.
# Şu anki yapıda tüm istekler authenticated olduğundan, dev profilinde
# Swagger endpoint'lerini permitAll yapmak için ek bir SecurityFilterChain bean'i
# eklenmelidir. Bu dosya yalnızca application properties içerir.
