spring.application.name=banking-platform

# ---------------------------------------------------------------------------
# Sunucu
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Veritabanı (PostgreSQL) - environment variable üzerinden sağlanmalıdır
# ---------------------------------------------------------------------------
# Prioritization: Environment Variables > .env file defaults > embedded defaults
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# must be set in the runtime environment (IntelliJ Run Configuration or .env loaded externally)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banking_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate - production benzeri yapılandırma
# Schema değişiklikleri Flyway üzerinden yönetilir, Hibernate ile otomatik
# oluşturulmaz veya güncellenmez (ddl-auto = validate).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# Flyway - versiyonlu, tekrarlanabilir migration
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------------
# JWT - environment variable üzerinden sağlanmalıdır (.env)
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:banking-platform}
jwt.access.token.expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
jwt.refresh.token.expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# ---------------------------------------------------------------------------
# Springdoc OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.bank.banking_platform.auth.controller
